<!DOCTYPE html>
<html>
<head>
    <title>Universe Verification</title>
</head>
<body style="font-family: Arial; padding: 20px;">

    <h2>Roblox Universe Verification</h2>

    <input id="userId" placeholder="User ID" /><br><br>
    <input id="universeId" placeholder="Universe ID" /><br><br>

    <button onclick="startFlow()">Start Verification</button>

    <div id="resultArea" style="display:none; margin-top:20px; padding:15px; border:2px solid #007bff; background:#f0f7ff; border-radius:8px;">
        <h3 style="margin-top:0;">Verification Successful!</h3>
        <p style="color: #d9534f; font-weight: bold;">Please copy your API key. ⚠️ This key will not be shown again.</p>
        <p>Copy your API key into your <strong>Experience Secrets</strong>:</p>

        <div id="keyDisplay" style="font-family: monospace; background: #eee; padding: 10px; margin-bottom: 10px; filter: blur(5px); user-select: none; word-break: break-all;">
            <!-- Key will appear here -->
        </div>

        <button id="copyBtn" style="padding:10px 20px; cursor:pointer; background:#007bff; color:white; border:none; border-radius:4px;">
            Reveal & Copy Key
        </button>
    </div>
<pre id="log" style="margin-top:20px;"></pre>

    <script>
        const log = (msg) => {
            document.getElementById("log").textContent += msg + "\n";
        };

        /* -----------------------------
           PoW Solver
        ----------------------------- */
        async function solvePoW(seed, difficulty) {
            const target = "0".repeat(difficulty);
            let nonce = 0;

            log("Solving PoW...");

            while (true) {
                const data = seed + nonce;

                const hashBuffer = await crypto.subtle.digest(
                    "SHA-256",
                    new TextEncoder().encode(data)
                );

                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray
                    .map(b => b.toString(16).padStart(2, "0"))
                    .join("");

                if (hashHex.startsWith(target)) {
                    log("PoW solved: " + nonce);
                    return nonce;
                }

                nonce++;
            }
        }

        /* -----------------------------
           MAIN FLOW
        ----------------------------- */
        async function startFlow() {
            const userId = document.getElementById("userId").value;
            const universeId = document.getElementById("universeId").value;

            if (!userId || !universeId) {
                alert("Missing fields");
                return;
            }

            document.getElementById("log").textContent = "";

            log("Fetching challenge for profile code...");
            const powRes = await fetch("/api/v1/creators/challenge");
            const powData = await powRes.json();
            const nonce1 = await solvePoW(powData.seed, powData.difficulty); log("Requesting profile code...");

            log("Generating...");
            const codeRes = await fetch("/api/v1/creators/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId,
                    seed: powData.seed,
                    nonce: nonce1
                })
            });

            const codeData = await codeRes.json();
            if (!codeRes.ok) {
                log("Error: " + JSON.stringify(codeData));
                return;
            }

            const confirmDone = confirm(
                `STEP 1: Put this code in your Roblox profile description:\n\n` +
                `${codeData.code}\n\n` +
                `STEP 2: Press OK once you have saved your profile.`
            );

            if (!confirmDone) {
                log("Verification cancelled by user.");
                return;
            }

            /* ---------------- Final Validation ---------------- */
            log("Fetching challenge for validation...");
            const valPowRes = await fetch("/api/v1/creators/challenge");
            const valPowData = await valPowRes.json();
            const nonce2 = await solvePoW(valPowData.seed, valPowData.difficulty);

            log("Validating...");
            const validateRes = await fetch("/api/v1/creators/confirm", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId,
                    universeId,
                    seed: valPowData.seed,
                    nonce: nonce2
                })
            });

            const result = await validateRes.json();

            if (result.ok && result.apiKey) {
                log("Success! Key generated.");

                // Show the UI box
                const area = document.getElementById("resultArea");
                const display = document.getElementById("keyDisplay");
                const btn = document.getElementById("copyBtn");

                area.style.display = "block";
                display.textContent = result.apiKey;

                // Set up the click event for the Reveal/Copy button
                btn.onclick = () => {
                    display.style.filter = "none"; // Remove blur
                    display.style.userSelect = "all"; // Allow highlighting

                    navigator.clipboard.writeText(result.apiKey);
                    alert("Key copied! Paste this into your Roblox Experience Secrets.");

                    btn.textContent = "Copied!";
                    btn.disabled = true;
                };

            } else {
                log("Result: " + (result.reason || "Failed"));
            }
        } // end of startFlow
    </script>

</body>
</html>
